[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codely-kb"
version = "0.1.0"
description = "Codely Knowledge Engine — MCP Server for document knowledge base, semantic search, and learning progress"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [{name = "hongfeng"}]
keywords = ["mcp", "rag", "knowledge-base", "embeddings", "codely"]

dependencies = [
    "markdown-it-py>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
embeddings = [
    "sentence-transformers>=2.7.0",
    "chromadb>=0.5.0",
]
pdf = ["PyMuPDF>=1.24.0"]
code = ["tree-sitter>=0.22.0"]
epub = ["ebooklib>=0.18"]
all = [
    "mcp>=1.0.0",
    "sentence-transformers>=2.7.0",
    "chromadb>=0.5.0",
    "PyMuPDF>=1.24.0",
    "tree-sitter>=0.22.0",
    "ebooklib>=0.18",
]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
codely-kb = "codely_kb.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
